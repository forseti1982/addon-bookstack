services:
  pms:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      PMS_DATABASE_URL: sqlite:///./pos_pms.db
      PMS_TERMINAL_API_KEYS: swipay-dev-terminal-key
    command: >
      sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
